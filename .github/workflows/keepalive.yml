name: Keepalive

# Tiene attivo il progetto Supabase (free: pausa dopo ~7gg senza richieste).
# Usa la RPC public.ping() (query reale sul DB) invece di un GET su tabella, che
# il 18/07 si e' rivelato insufficiente (progetto andato in pausa lo stesso).
# Il ping FALLISCE il job se non risponde 200 (email d'avviso: cosi' si VEDE).
on:
  schedule:
    - cron: '30 6 */2 * *'   # ogni 2 giorni, 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (RPC public.ping)
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWFydnpyam54Z2J0cnFqa2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMzNzIsImV4cCI6MjA5NzI5OTM3Mn0.akHCJ8VhL9p_NsiaW_Pj7i17T-uhBg6LHzJUoTjNw9E"
          code=$(curl -sS -o /tmp/r -w "%{http_code}" -X POST \
            "https://yaiarvzrjnxgbtrqjkfz.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase RPC ping -> HTTP $code"; cat /tmp/r 2>/dev/null; echo
          test "$code" = "200"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Heartbeat (evita auto-disable del workflow dopo 60 giorni)
        run: |
          DIFF=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Giorni dall'ultimo commit: $DIFF"
          if [ "$DIFF" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive heartbeat [skip ci]"
            git push
          else
            echo "Nessun heartbeat necessario"
          fi
