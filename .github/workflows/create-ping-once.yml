name: Crea RPC ping (one-shot)
on: { workflow_dispatch: {} }
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Crea public.ping() via Management API
        env:
          MGMT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          SQL="create or replace function public.ping() returns jsonb language sql security definer set search_path = public as \$\$ select to_jsonb(now()) \$\$; grant execute on function public.ping() to anon, authenticated;"
          body=$(SQL="$SQL" node -e 'console.log(JSON.stringify({query:process.env.SQL}))')
          code=$(curl -s -o /tmp/r -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/yaiarvzrjnxgbtrqjkfz/database/query" -H "Authorization: Bearer $MGMT" -H "Content-Type: application/json" -d "$body")
          echo "SQL -> HTTP $code"; cat /tmp/r 2>/dev/null; echo
          case "$code" in 2*) echo "RPC creata";; *) echo "::error::SQL HTTP $code"; exit 1;; esac
